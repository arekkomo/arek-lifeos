<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gym Buddy — Arek's Coach</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #6c63ff;
    --accent2: #ff6b6b;
    --green: #3ecf8e;
    --yellow: #ffd166;
    --text: #e8e8f0;
    --text2: #8888aa;
    --text3: #4444660;
    --radius: 14px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  /* ===== HEADER ===== */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
  }
  .header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
  .header h1 span { color: var(--accent); }
  .date-chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--text2);
  }
  .day-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: white;
    border-radius: 8px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .day-badge .dot { width: 7px; height: 7px; background: rgba(255,255,255,0.6); border-radius: 50%; }

  .progress-bar-wrap {
    margin-top: 12px;
    background: var(--border);
    border-radius: 4px;
    height: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 4px;
    transition: width 0.5s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    margin-top: 5px;
    font-size: 11px;
    color: var(--text2);
  }

  /* ===== CONFIG PANEL ===== */
  .config-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin: 14px 14px 0;
  }
  .config-panel h3 { font-size: 13px; color: var(--text2); font-weight: 600; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .config-field { margin-bottom: 10px; }
  .config-field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 4px; }
  .config-field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    color: var(--text);
    font-size: 13px;
  }
  .config-field input:focus { outline: none; border-color: var(--accent); }
  .btn-save-config {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-top: 4px;
  }
  .config-toggle { font-size: 12px; color: var(--accent); cursor: pointer; margin: 10px 14px 0; display: block; }

  /* ===== EXERCISE CARDS ===== */
  .exercises-container { padding: 14px; display: flex; flex-direction: column; gap: 14px; }

  .exercise-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.2s;
  }
  .exercise-card.completed { border-color: var(--green); }
  .exercise-card.active { border-color: var(--accent); }

  .card-header {
    padding: 14px 16px;
    cursor: pointer;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .exercise-img {
    width: 72px;
    height: 60px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--surface2);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; line-height: 1.2; }
  .muscle-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .muscle-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-size: 10px;
    color: var(--text2);
    font-weight: 500;
  }
  .muscle-tag.primary { border-color: var(--accent); color: var(--accent); }
  .last-session-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text2);
  }
  .last-session-row .clock-icon { font-size: 11px; }
  .last-session-row strong { color: var(--yellow); }

  .card-status {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    transition: all 0.2s;
  }
  .card-status.done { background: var(--green); border-color: var(--green); color: white; }

  /* ===== SETS SECTION ===== */
  .sets-section {
    padding: 0 16px 16px;
    display: none;
  }
  .sets-section.open { display: block; }

  .coaching-cue {
    background: var(--surface2);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text2);
    line-height: 1.5;
    margin-bottom: 14px;
  }

  .sets-header {
    display: grid;
    grid-template-columns: 32px 1fr 1fr 1fr;
    gap: 8px;
    font-size: 11px;
    color: var(--text2);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 0 0 6px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }

  .set-row {
    display: grid;
    grid-template-columns: 32px 1fr 1fr 1fr;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .set-number {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text2);
  }
  .set-number.logged { background: var(--accent); border-color: var(--accent); color: white; }

  .prev-value {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--text2);
    text-align: center;
    font-weight: 500;
  }
  .prev-value.has-data { color: var(--yellow); }

  .set-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    width: 100%;
    -moz-appearance: textfield;
  }
  .set-input::-webkit-inner-spin-button,
  .set-input::-webkit-outer-spin-button { -webkit-appearance: none; }
  .set-input:focus { outline: none; border-color: var(--accent); }
  .set-input.pr { border-color: var(--green); background: rgba(62,207,142,0.05); }

  .add-set-btn {
    background: none;
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 7px;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    width: 100%;
    margin: 4px 0 12px;
    transition: all 0.15s;
  }
  .add-set-btn:hover { border-color: var(--accent); color: var(--accent); }

  .log-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 11px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    letter-spacing: 0.3px;
    transition: opacity 0.15s;
  }
  .log-btn:active { opacity: 0.8; }
  .log-btn.saved { background: var(--green); }
  .log-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== COMPLETE SECTION ===== */
  .complete-section {
    margin: 14px;
    padding: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    text-align: center;
  }
  .complete-section h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .complete-section p { font-size: 13px; color: var(--text2); margin-bottom: 14px; }
  .complete-btn {
    background: linear-gradient(135deg, var(--accent), #9b5de5);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    letter-spacing: 0.3px;
  }
  .complete-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    z-index: 999;
    transition: transform 0.3s ease;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { border-color: var(--green); color: var(--green); }
  .toast.error { border-color: var(--accent2); color: var(--accent2); }

  /* ===== REST SCREEN ===== */
  .rest-screen {
    padding: 40px 20px;
    text-align: center;
  }
  .rest-icon { font-size: 60px; margin-bottom: 16px; }
  .rest-screen h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .rest-screen p { font-size: 14px; color: var(--text2); line-height: 1.6; }

  /* ===== LOADING ===== */
  .loading-screen {
    padding: 60px 20px;
    text-align: center;
    color: var(--text2);
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (min-width: 480px) {
    .exercises-container { max-width: 560px; margin: 0 auto; }
    .complete-section, .config-panel { max-width: 560px; margin-left: auto; margin-right: auto; }
    .config-toggle { max-width: 560px; margin-left: auto; margin-right: auto; display: block; }
  }
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<div class="header">
  <div class="header-top">
    <h1>Gym <span>Buddy</span></h1>
    <div class="date-chip" id="dateChip">Loading...</div>
  </div>
  <div id="dayBadge" class="day-badge">
    <span class="dot"></span>
    <span id="dayName">Loading workout...</span>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-label">
    <span id="progressText">0 of 0 exercises logged</span>
    <span id="progressPct">0%</span>
  </div>
</div>

<!-- Config toggle -->
<span class="config-toggle" id="configToggle" onclick="toggleConfig()">⚙️ Configure n8n webhook URL</span>

<!-- Config panel (hidden by default) -->
<div class="config-panel" id="configPanel" style="display:none">
  <h3>🔧 Setup</h3>
  <div class="config-field">
    <label>n8n Webhook Base URL</label>
    <input type="url" id="webhookUrl" placeholder="https://your-n8n.com/webhook/gym" />
  </div>
  <div class="config-field">
    <label>Your Name (for logging)</label>
    <input type="text" id="userName" value="Arek" />
  </div>
  <button class="btn-save-config" onclick="saveConfig()">Save & Reload</button>
</div>

<!-- Main content -->
<div id="mainContent"></div>

<!-- Complete session section -->
<div class="complete-section" id="completeSection" style="display:none">
  <h3>💪 Finish Session</h3>
  <p>Log your session so your Coach can track progress and adjust next week's targets.</p>
  <button class="complete-btn" id="completeBtn" onclick="completeSession()">Send to Coach & Finish</button>
</div>

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  CONFIG
// ============================================================
const DEFAULT_WEBHOOK = 'https://YOUR-N8N-URL/webhook/gym'; // ← replace with your n8n URL

function getConfig() {
  return {
    webhookUrl: localStorage.getItem('gymBuddy_webhook') || DEFAULT_WEBHOOK,
    userName: localStorage.getItem('gymBuddy_user') || 'Arek',
  };
}

function saveConfig() {
  localStorage.setItem('gymBuddy_webhook', document.getElementById('webhookUrl').value.trim());
  localStorage.setItem('gymBuddy_user', document.getElementById('userName').value.trim());
  showToast('Config saved!', 'success');
  setTimeout(() => location.reload(), 800);
}

function toggleConfig() {
  const panel = document.getElementById('configPanel');
  const cfg = getConfig();
  document.getElementById('webhookUrl').value = cfg.webhookUrl;
  document.getElementById('userName').value = cfg.userName;
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

//  DAY TYPE MAPPING
// ============================================================

// ============================================================
//  STATE
// ============================================================
let sessionData = {}; // { exerciseName: { sets: [{weight, reps}] } }
let lastSessionData = {}; // fetched from n8n
let currentDayType = null;
let exercises = [];
let completedCount = 0;

// ============================================================
//  INIT
// ============================================================
document.addEventListener('DOMContentLoaded', init);

async function init() {
  const now = new Date();
  const dow = now.getDay();

  // Header date
  document.getElementById('dateChip').textContent = now.toLocaleDateString('en-GB', {
    weekday: 'short', day: 'numeric', month: 'short'
  });

  const dayInfo = DAY_SCHEDULE[dow];

  if (!dayInfo) {
    // Rest day
    document.getElementById('dayName').textContent = 'Rest Day';
    document.getElementById('dayBadge').style.background = '#334155';
    document.getElementById('mainContent').innerHTML = `
      <div class="rest-screen">
        <div class="rest-icon">🛌</div>
        <h2>Rest Day</h2>
        <p>Today is your recovery day. Your muscles grow during rest, not during training.<br><br>
        Focus on: good sleep, high protein, stay mobile.</p>
      </div>`;
    return;
  }

  currentDayType = dayInfo.type;
  exercises = EXERCISE_DB[currentDayType] || [];

  document.getElementById('dayName').textContent = `${dayInfo.emoji} ${currentDayType}`;
  document.getElementById('dayBadge').style.background = dayInfo.colour;

  // Show loading
  document.getElementById('mainContent').innerHTML = `
    <div class="loading-screen">
      <div class="spinner"></div>
      <p>Loading your workout...</p>
    </div>`;

  // Fetch last session data
  try {
    await fetchLastSessionData();
  } catch(e) {
    console.log('Could not fetch last session — using empty defaults', e);
  }

  renderExercises();
  document.getElementById('completeSection').style.display = 'block';
  updateProgress();
}

// ============================================================
//  FETCH LAST SESSION FROM N8N
// ============================================================
async function fetchLastSessionData() {
  const cfg = getConfig();
  if (cfg.webhookUrl.includes('YOUR-N8N-URL')) return; // not configured yet

  for (const ex of exercises) {
    try {
      const res = await fetch(`${cfg.webhookUrl}/last-session?exercise=${encodeURIComponent(ex.name)}`, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' },
      });
      if (res.ok) {
        const data = await res.json();
        lastSessionData[ex.name] = data; // { sets: [{weight, reps}], date: '...' }
      }
    } catch(e) { /* silent — offline fallback */ }
  }
}

// ============================================================
//  RENDER
// ============================================================
function renderExercises() {
  const container = document.createElement('div');
  container.className = 'exercises-container';

  exercises.forEach((ex, idx) => {
    const last = lastSessionData[ex.name];
    const hasPrev = last && last.sets && last.sets.length > 0;

    // Init session data
    if (!sessionData[ex.name]) {
      sessionData[ex.name] = { sets: Array.from({length: ex.sets}, (_, i) => {
        const prev = hasPrev && last.sets[i];
        return { weight: prev ? prev.weight : '', reps: prev ? prev.reps : '' };
      })};
    }

    const card = document.createElement('div');
    card.className = 'exercise-card';
    card.id = `card-${idx}`;

    // Last session summary line
    let lastLine = 'No previous data';
    if (hasPrev) {
      const maxW = Math.max(...last.sets.map(s => s.weight || 0));
      const totalReps = last.sets.reduce((a,s) => a + (s.reps || 0), 0);
      lastLine = `Last: <strong>${last.sets.length} sets · ${maxW}kg · ${totalReps} reps total</strong>`;
      if (last.date) lastLine += ` <span style="color:#4444660">(${last.date})</span>`;
    }

    card.innerHTML = `
      <div class="card-header" onclick="toggleCard(${idx})">
        <div class="exercise-img">${ex.emoji}</div>
        <div class="card-info">
          <div class="card-title">${ex.name}</div>
          <div class="muscle-tags">
            <span class="muscle-tag primary">${ex.primary}</span>
            ${ex.secondary.slice(0,2).map(m => `<span class="muscle-tag">${m}</span>`).join('')}
          </div>
          <div class="last-session-row">
            <span class="clock-icon">⏱</span>
            <span>${lastLine}</span>
          </div>
        </div>
        <div class="card-status" id="status-${idx}">›</div>
      </div>
      <div class="sets-section" id="sets-${idx}">
        <div class="coaching-cue">💡 ${ex.cue}</div>
        <div class="sets-header">
          <div>#</div><div>Last kg</div><div>Weight kg</div><div>Reps</div>
        </div>
        <div id="set-rows-${idx}"></div>
        <button class="add-set-btn" onclick="addSet(${idx}, event)">+ Add set</button>
        <button class="log-btn" id="log-btn-${idx}" onclick="logExercise(${idx}, event)">
          Log ${ex.name.split(' ')[0]} ✓
        </button>
      </div>`;

    container.appendChild(card);
  });

  document.getElementById('mainContent').replaceWith(container);

  // Render set rows for all exercises
  exercises.forEach((_, idx) => renderSetRows(idx));
}

function renderSetRows(idx) {
  const ex = exercises[idx];
  const sets = sessionData[ex.name].sets;
  const last = lastSessionData[ex.name];
  const container = document.getElementById(`set-rows-${idx}`);
  if (!container) return;
  container.innerHTML = '';

  sets.forEach((set, si) => {
    const prevSet = last && last.sets && last.sets[si];
    const prevW = prevSet ? prevSet.weight : null;
    const prevR = prevSet ? prevSet.reps : null;

    const row = document.createElement('div');
    row.className = 'set-row';
    row.innerHTML = `
      <div class="set-number" id="snum-${idx}-${si}">${si+1}</div>
      <div class="prev-value ${prevW ? 'has-data' : ''}">${prevW ? `${prevW}kg` : '—'}</div>
      <input class="set-input" type="number" step="0.5" min="0"
             id="w-${idx}-${si}" value="${set.weight}" placeholder="${prevW || '0'}"
             oninput="updateSet(${idx},${si},'weight',this.value)">
      <input class="set-input" type="number" step="1" min="0"
             id="r-${idx}-${si}" value="${set.reps}" placeholder="${prevR || ex.targetReps.split('–')[0]}"
             oninput="updateSet(${idx},${si},'reps',this.value)">`;
    container.appendChild(row);
  });
}

function toggleCard(idx) {
  const section = document.getElementById(`sets-${idx}`);
  section.classList.toggle('open');
  // Focus first empty weight input
  if (section.classList.contains('open')) {
    const firstEmpty = section.querySelector('.set-input:not([value=""])') ||
                       section.querySelector('.set-input');
    if (firstEmpty) setTimeout(() => firstEmpty.focus(), 100);
  }
}

function addSet(idx, e) {
  e.stopPropagation();
  const ex = exercises[idx];
  sessionData[ex.name].sets.push({ weight: '', reps: '' });
  renderSetRows(idx);
}

function updateSet(idx, si, field, val) {
  const ex = exercises[idx];
  sessionData[ex.name].sets[si][field] = val === '' ? '' : parseFloat(val);
  checkForPR(idx, si);
}

function checkForPR(idx, si) {
  const ex = exercises[idx];
  const set = sessionData[ex.name].sets[si];
  const last = lastSessionData[ex.name];
  if (!last || !last.sets || !set.weight) return;
  const prevMax = Math.max(...last.sets.map(s => s.weight || 0));
  const wInput = document.getElementById(`w-${idx}-${si}`);
  if (wInput) wInput.classList.toggle('pr', parseFloat(set.weight) > prevMax);
}

// ============================================================
//  LOG EXERCISE
// ============================================================
async function logExercise(idx, e) {
  e.stopPropagation();
  const ex = exercises[idx];
  const sets = sessionData[ex.name].sets.filter(s => s.weight !== '' || s.reps !== '');

  if (sets.length === 0) {
    showToast('Enter at least one set first', 'error');
    return;
  }

  const btn = document.getElementById(`log-btn-${idx}`);
  btn.textContent = 'Saving...';
  btn.disabled = true;

  const payload = {
    exercise: ex.name,
    primaryMuscle: ex.primary,
    dayType: currentDayType,
    date: new Date().toISOString().slice(0,10),
    sets: sets,
    totalSets: sets.length,
    user: getConfig().userName,
  };

  try {
    await postToN8n('/log-set', payload);
    btn.textContent = '✓ Saved';
    btn.classList.add('saved');
    btn.disabled = false;

    // Mark card complete
    const card = document.getElementById(`card-${idx}`);
    card.classList.add('completed');
    const status = document.getElementById(`status-${idx}`);
    status.textContent = '✓';
    status.classList.add('done');

    completedCount++;
    updateProgress();
    showToast(`${ex.name.split(' ')[0]} logged! 💪`, 'success');
  } catch(err) {
    btn.textContent = 'Retry ↻';
    btn.disabled = false;
    showToast('Save failed — check n8n config', 'error');
  }
}

// ============================================================
//  COMPLETE SESSION
// ============================================================
async function completeSession() {
  const btn = document.getElementById('completeBtn');
  btn.textContent = 'Sending to Coach...';
  btn.disabled = true;

  const summary = {
    date: new Date().toISOString().slice(0,10),
    dayType: currentDayType,
    exercisesLogged: Object.keys(sessionData).filter(k =>
      sessionData[k].sets.some(s => s.weight !== '' || s.reps !== '')
    ).length,
    totalExercises: exercises.length,
    exercises: Object.entries(sessionData).map(([name, data]) => ({
      name, sets: data.sets.filter(s => s.weight !== '' || s.reps !== '')
    })).filter(e => e.sets.length > 0),
    user: getConfig().userName,
  };

  try {
    await postToN8n('/session-complete', summary);
    btn.textContent = '✅ Session sent to Coach!';
    showToast('Session complete! Great work 💪', 'success');
  } catch(err) {
    btn.textContent = 'Retry ↻';
    btn.disabled = false;
    showToast('Could not send — check n8n config', 'error');
  }
}

// ============================================================
//  API
// ============================================================
async function postToN8n(path, data) {
  const cfg = getConfig();
  if (cfg.webhookUrl.includes('YOUR-N8N-URL')) {
    // Demo mode — log to console instead
    console.log('n8n not configured. Would send:', path, data);
    await new Promise(r => setTimeout(r, 600)); // simulate delay
    return { ok: true };
  }
  const res = await fetch(`${cfg.webhookUrl}${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ============================================================
//  UI HELPERS
// ============================================================
function updateProgress() {
  const total = exercises.length;
  const pct = total > 0 ? Math.round((completedCount / total) * 100) : 0;
  document.getElementById('progressFill').style.width = `${pct}%`;
  document.getElementById('progressText').textContent = `${completedCount} of ${total} exercises logged`;
  document.getElementById('progressPct').textContent = `${pct}%`;
}

let toastTimer;
function showToast(msg, type='success') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
